<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: Tahoma, sans-serif;
            margin: 0;
            gap: 20px;
        }
        .card {
            width: 300px;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        .card h3 { margin: 0; }
    </style>
</head>
<body>
    <a href="https://github.com/atnsad/aimi-v1.1" class="card">
        <h3>ریپازیتوری</h3>
    </a>
    <a href="https://atnsad.github.io/aimi-v1.1" class="card">
        <h3>ورود به برنامه</h3>
    </a>

</body>
</html>
